<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель звонков (WebRTC)</title>
    <script src="https://unpkg.com/@telnyx/webrtc@2.22.0/lib/bundle.js"></script>
    <style>
        body { background-color: #1e293b; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; }
        .card { background: #0f172a; padding: 20px; border-radius: 15px; border: 1px solid #334155; margin-bottom: 20px; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid #475569; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 8px; background: #38bdf8; color: black; font-weight: bold; font-size: 16px; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 15px; background: #1e293b; border-radius: 8px; text-align: center; }
        .timer { font-size: 24px; color: #4ade80; font-weight: bold; margin-top: 5px; }
        .error { color: #f87171; text-align: center; margin-top: 15px; font-size: 14px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button { background: transparent; color: #94a3b8; border: 1px solid #475569; }
        .tabs button.active { background: #38bdf8; color: black; border-color: #38bdf8; }
        
        /* Стили для карточек истории */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .call-card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .call-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #94a3b8; }
        .call-number { font-size: 18px; font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; }
        .call-details { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #cbd5e1; }
        .call-actions { display: flex; gap: 10px; margin-top: 5px; }
        .call-actions audio { flex-grow: 1; height: 35px; }
        .btn-download { background: #38bdf8; color: black; text-decoration: none; padding: 0 15px; border-radius: 5px; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .btn-download:hover { background: #0ea5e9; }
        
        .incoming { color: #4ade80; }
        .outgoing { color: #fbbf24; }

        #call-panel, #history-panel { display: none; }
    </style>
</head>
<body>
    <audio id="remoteMedia" autoplay="true"></audio>
    <div class="container">
        <div id="login-panel" class="card">
            <h2>ВХОД</h2>
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="doLogin()">ВОЙТИ</button>
            <div id="login-error" class="error"></div>
        </div>
        <div id="app" style="display: none;">
            <div class="tabs">
                <button id="tab-call" class="active" onclick="switchTab('call')">Звонок</button>
                <button id="tab-history" onclick="switchTab('history')">История</button>
                <button onclick="location.reload()" style="margin-left: auto; width: auto; padding: 10px;">Выйти</button>
            </div>
            <div id="call-panel" class="card" style="display: block;">
                <h2>ПАНЕЛЬ ЗВОНКОВ</h2>
                <input type="text" id="to" placeholder="Номер клиента (+995...)" value="+995500333310">
                <input type="text" id="from" list="numbers" placeholder="С какого номера звонить">
                <datalist id="numbers"></datalist>
                <button id="call-btn" onclick="toggleCall()" style="background: #475569;">Загрузка...</button>
                <div class="status-box">
                    <div id="status" style="color: #94a3b8;">Подключение к серверу...</div>
                    <div id="timer" class="timer">00:00</div>
                </div>
            </div>
            
            <div id="history-panel" class="card">
                <h2>ИСТОРИЯ ЗВОНКОВ</h2>
                <div class="history-list" id="history-list">
                    <!-- Сюда будут добавляться карточки -->
                </div>
            </div>
        </div>
    </div>
    <script>
        let client = null, currentCall = null, timerInterval = null, seconds = 0, isClientReady = false;
        
        async function doLogin() {
            const login = document.getElementById('login').value, password = document.getElementById('password').value;
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login, password }) });
            if (res.ok) { document.getElementById('login-panel').style.display = 'none'; document.getElementById('app').style.display = 'block'; loadNumbers(); initTelnyx(); }
            else document.getElementById('login-error').innerText = 'Неверные данные!';
        }

        async function initTelnyx() {
            const btn = document.getElementById('call-btn'), status = document.getElementById('status');
            try {
                status.innerText = 'Получение токена...';
                const res = await fetch('/api/token'); const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка токена');
                status.innerText = 'Подключение WebRTC...';
                client = new TelnyxWebRTC.TelnyxRTC({ login_token: data.token });
                client.remoteElement = 'remoteMedia';
                client.on('telnyx.ready', () => { isClientReady = true; status.innerText = 'Готов к звонку'; btn.innerText = 'ПОЗВОНИТЬ'; btn.style.background = '#38bdf8'; btn.disabled = false; });
                client.on('telnyx.error', (err) => { console.error(err); status.innerText = 'Ошибка WebRTC'; resetCallUI(); });
                client.on('telnyx.notification', (n) => {
                    if (n.type === 'callUpdate') {
                        const call = n.call;
                        if (call.state === 'active') { status.innerText = 'Звонок идет (разговор)...'; startTimer(); }
                        else if (call.state === 'hangup' || call.state === 'destroy') { status.innerText = 'Звонок завершен'; resetCallUI(); }
                        else if (call.state === 'ringing') status.innerText = 'Дозвон...';
                    }
                });
                client.connect();
            } catch (e) { status.innerText = 'Ошибка: ' + e.message; btn.disabled = true; }
        }

        async function loadNumbers() { 
            const res = await fetch('/api/numbers'); 
            const nums = await res.json(); 
            document.getElementById('numbers').innerHTML = nums.map(n => `<option value="${n.number}">${n.label}</option>`).join(''); 
        }

        function toggleCall() {
            const btn = document.getElementById('call-btn');
            if (currentCall) { try { currentCall.hangup(); } catch(e) {} resetCallUI(); return; }
            if (!isClientReady) { document.getElementById('status').innerText = 'Подождите...'; return; }
            const to = document.getElementById('to').value, from = document.getElementById('from').value;
            if (!to || !from) { document.getElementById('status').innerText = 'Заполните оба номера!'; return; }
            document.getElementById('status').innerText = 'Инициализация звонка...'; btn.innerText = 'ОТМЕНИТЬ'; btn.style.background = '#f87171';
            try { currentCall = client.newCall({ destinationNumber: to, callerNumber: from, audio: true, video: false }); } catch (e) { resetCallUI(); }
        }

        function resetCallUI() { stopTimer(); currentCall = null; const btn = document.getElementById('call-btn'); btn.innerText = 'ПОЗВОНИТЬ'; btn.style.background = '#38bdf8'; document.getElementById('timer').innerText = '00:00'; }
        function startTimer() { stopTimer(); seconds = 0; document.getElementById('timer').innerText = '00:00'; timerInterval = setInterval(() => { seconds++; document.getElementById('timer').innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000); }
        function stopTimer() { if (timerInterval) clearInterval(timerInterval); }

        async function switchTab(tab) {
            document.getElementById('call-panel').style.display = tab === 'call' ? 'block' : 'none';
            document.getElementById('history-panel').style.display = tab === 'history' ? 'block' : 'none';
            document.getElementById('tab-call').className = tab === 'call' ? 'active' : '';
            document.getElementById('tab-history').className = tab === 'history' ? 'active' : '';
            
            if (tab === 'history') {
                const res = await fetch('/api/history'); const data = await res.json();
                const list = document.getElementById('history-list');
                
                if(data.length === 0) {
                    list.innerHTML = `<p style="text-align:center; color:#94a3b8;">История пока пуста</p>`;
                    return;
                }

                list.innerHTML = data.map(item => {
                    const isIncoming = item.direction === 'incoming';
                    // Иконка и текст для исходящего/входящего
                    const dirIcon = isIncoming ? '📥' : '📤';
                    const dirText = isIncoming ? 'Входящий' : 'Исходящий';
                    const dirClass = isIncoming ? 'incoming' : 'outgoing';
                    const arrow = isIncoming ? '↙️' : '↗️'; // Стрелочка направления

                    // Кнопки, если есть запись
                    const audioHtml = item.recording 
                        ? `<div class="call-actions">
                             <audio controls src="${item.recording}"></audio>
                             <a href="${item.recording}" download="record_${item.from || item.to}.mp3" class="btn-download" title="Скачать запись">⬇️</a>
                           </div>` 
                        : `<div style="color: #f87171; font-size: 12px;">Записи нет</div>`;

                    return `
                    <div class="call-card">
                        <div class="call-header">
                            <span class="${dirClass}">${dirIcon} ${dirText} ${arrow}</span>
                            <span>${item.time || '-'}</span>
                        </div>
                        <div class="call-number">
                            ${isIncoming ? 'От: ' : 'Кому: '} ${isIncoming ? item.from : item.to}
                        </div>
                        <div class="call-details">
                            <span>Длительность: ${item.duration ? item.duration + ' сек.' : '-'}</span>
                            <span>${item.status || ''}</span>
                        </div>
                        ${audioHtml}
                    </div>
                `}).join('');
            }
        }
    </script>
</body>
</html>
