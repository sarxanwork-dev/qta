<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель звонков (WebRTC)</title>
    <script src="https://unpkg.com/@telnyx/webrtc@2.22.0/lib/bundle.js"></script>
    <style>
        body { background-color: #1e293b; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
        .container { width: 500px; }
        .card { background: #0f172a; padding: 30px; border-radius: 15px; border: 1px solid #334155; margin-bottom: 20px; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid #475569; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 8px; background: #38bdf8; color: black; font-weight: bold; font-size: 16px; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 15px; background: #1e293b; border-radius: 8px; text-align: center; }
        .timer { font-size: 24px; color: #4ade80; font-weight: bold; margin-top: 5px; }
        .error { color: #f87171; text-align: center; margin-top: 15px; font-size: 14px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tabs button { background: transparent; color: #94a3b8; border: 1px solid #475569; }
        .tabs button.active { background: #38bdf8; color: black; border-color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #38bdf8; }
        audio { width: 150px; height: 30px; }
        #call-panel, #history-panel { display: none; }
    </style>
</head>
<body>
    <!-- Скрытый элемент для воспроизведения звука собеседника -->
    <audio id="remoteMedia" autoplay="true"></audio>

    <div class="container">
        <div id="login-panel" class="card">
            <h2>ВХОД</h2>
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="doLogin()">ВОЙТИ</button>
            <div id="login-error" class="error"></div>
        </div>

        <div id="app" style="display: none;">
            <div class="tabs">
                <button id="tab-call" class="active" onclick="switchTab('call')">Звонок</button>
                <button id="tab-history" onclick="switchTab('history')">История</button>
                <button onclick="location.reload()" style="margin-left: auto; width: auto; padding: 10px;">Выйти</button>
            </div>

            <div id="call-panel" class="card" style="display: block;">
                <h2>ПАНЕЛЬ ЗВОНКОВ</h2>
                <input type="text" id="to" placeholder="Номер клиента (+995...)" value="+995500333310">
                <input type="text" id="from" list="numbers" placeholder="С какого номера звонить">
                <datalist id="numbers"></datalist>
                
                <button id="call-btn" onclick="toggleCall()" style="background: #475569;">Загрузка...</button>
                
                <div class="status-box">
                    <div id="status" style="color: #94a3b8;">Подключение к серверу...</div>
                    <div id="timer" class="timer">00:00</div>
                </div>
            </div>

            <div id="history-panel" class="card">
                <h2>ИСТОРИЯ ЗВОНКОВ</h2>
                <table>
                    <thead><tr><th>Время</th><th>Откуда</th><th>Куда</th><th>Запись</th></tr></thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let client = null;
        let currentCall = null;
        let timerInterval = null;
        let seconds = 0;
        let isClientReady = false;

        async function doLogin() {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });
            if (res.ok) {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadNumbers();
                initTelnyx();
            } else {
                document.getElementById('login-error').innerText = 'Неверные данные!';
            }
        }

        async function initTelnyx() {
            const btn = document.getElementById('call-btn');
            const status = document.getElementById('status');

            try {
                status.innerText = 'Получение токена...';
                const res = await fetch('/api/token');
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Ошибка токена');

                status.innerText = 'Подключение WebRTC...';
                client = new TelnyxWebRTC.TelnyxRTC({ login_token: data.token, debug: true, debugOutput: 'socket' });
                
                // Связываем аудиоплеер с клиентом для прослушивания
                client.remoteElement = 'remoteMedia';
                
                client.on('telnyx.ready', () => {
                    isClientReady = true;
                    status.innerText = 'Готов к звонку';
                    btn.innerText = 'ПОЗВОНИТЬ';
                    btn.style.background = '#38bdf8';
                    btn.disabled = false;
                });

                client.on('telnyx.error', (err) => {
                    console.error('Фатальная ошибка WebRTC:', err);
                    status.innerText = 'Ошибка WebRTC. Проверьте консоль (F12).';
                    resetCallUI();
                });

                client.on('telnyx.notification', (notification) => {
                    console.log('Получено уведомление:', notification);
                    if (notification.type === 'callUpdate') {
                        const call = notification.call;
                        console.log('Состояние звонка:', call.state);
                        switch (call.state) {
                            case 'new': status.innerText = 'Создание звонка...'; break;
                            case 'requesting': status.innerText = 'Отправка запроса...'; break;
                            case 'ringing': status.innerText = 'Дозвон... (гудки)'; break;
                            case 'active':
                                status.innerText = 'Звонок идет (разговор)...';
                                startTimer();
                                break;
                            case 'hangup':
                            case 'destroy':
                                status.innerText = 'Звонок завершен';
                                resetCallUI();
                                break;
                        }
                    } else if (notification.type === 'userMediaError') {
                        status.innerText = 'Ошибка: Нет доступа к микрофону!';
                        console.error('Ошибка доступа к микрофону:', notification.error);
                        resetCallUI();
                    } else if (notification.type === 'peerConnectionFailedError') {
                        status.innerText = 'Ошибка: Не удалось установить медиа-соединение!';
                        console.error('Ошибка PeerConnection:', notification.error);
                        resetCallUI();
                    }
                });

                client.connect();
            } catch (e) {
                console.error('Ошибка инициализации', e);
                status.innerText = 'Ошибка: ' + e.message;
                btn.disabled = true;
            }
        }

        async function loadNumbers() {
            const res = await fetch('/api/numbers');
            const nums = await res.json();
            const datalist = document.getElementById('numbers');
            datalist.innerHTML = nums.map(n => `<option value="${n.number}">${n.label}</option>`).join('');
        }

        function toggleCall() {
            const btn = document.getElementById('call-btn');
            
            if (currentCall) {
                try {
                    currentCall.hangup();
                } catch(e) { console.log(e); }
                resetCallUI();
                return;
            }

            if (!isClientReady) {
                document.getElementById('status').innerText = 'Подождите, идет подключение...';
                return;
            }

            const to = document.getElementById('to').value;
            const from = document.getElementById('from').value;

            if (!to || !from) { 
                document.getElementById('status').innerText = 'Заполните оба номера!'; 
                return; 
            }

            document.getElementById('status').innerText = 'Инициализация звонка...';
            btn.innerText = 'ОТМЕНИТЬ';
            btn.style.background = '#f87171';

            try {
                currentCall = client.newCall({
                    destinationNumber: to,
                    callerNumber: from,
                    audio: true,
                    video: false
                });
            } catch (e) {
                document.getElementById('status').innerText = 'Ошибка создания звонка';
                resetCallUI();
            }
        }

        function resetCallUI() {
            stopTimer();
            currentCall = null;
            const btn = document.getElementById('call-btn');
            btn.innerText = 'ПОЗВОНИТЬ';
            btn.style.background = '#38bdf8';
            document.getElementById('timer').innerText = '00:00';
        }

        function startTimer() {
            stopTimer();
            seconds = 0;
            document.getElementById('timer').innerText = '00:00';
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        async function switchTab(tab) {
            document.getElementById('call-panel').style.display = tab === 'call' ? 'block' : 'none';
            document.getElementById('history-panel').style.display = tab === 'history' ? 'block' : 'none';
            document.getElementById('tab-call').className = tab === 'call' ? 'active' : '';
            document.getElementById('tab-history').className = tab === 'history' ? 'active' : '';

            if (tab === 'history') {
                const res = await fetch('/api/history');
                const data = await res.json();
                document.getElementById('history-body').innerHTML = data.map(item => `
                    <tr>
                        <td>${item.time}</td>
                        <td>${item.from}</td>
                        <td>${item.to}</td>
                        <td>${item.recording ? `<audio controls src="${item.recording}"></audio>` : 'Нет'}</td>
                    </tr>
                `).join('');
            }
        }
    </script>
</body>
</html>
